<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hedge Fund Lab - Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --bg-panel: rgba(20, 24, 32, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --primary: #00e676;
            --primary-glow: rgba(0, 230, 118, 0.2);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --font-ui: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 230, 118, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 136, 255, 0.04) 0%, transparent 50%);
        }

        header {
            padding: 1.5rem 3rem;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 12, 16, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand span {
            color: var(--primary);
        }

        main {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            padding: 2rem 3rem;
            flex: 1;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            font-family: var(--font-ui);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .btn-run {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-run:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.3);
        }

        .btn-run:active {
            transform: translateY(0);
        }

        .terminal-container {
            background: #0d1117;
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .terminal-header {
            background: rgba(255,255,255,0.03);
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444;
            transition: all 0.3s;
        }

        .status-dot.active {
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
        }

        .terminal-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .terminal-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.6;
            color: #c9d1d9;
            white-space: pre-wrap;
        }

        .terminal-body span.info { color: #58a6ff; }
        .terminal-body span.error { color: #f85149; }
        .terminal-body span.success { color: #3fb950; }
        .terminal-body span.warning { color: #d29922; }
        .terminal-body span.dim { color: #484f58; }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .terminal-container { height: 500px; }
        }

        /* Loading Animation */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,0,0,0.2);
            border-left-color: #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .btn-run.loading {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            opacity: 0.8;
            pointer-events: none;
        }
        .btn-run.loading .spinner { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Hedge Fund <span>Lab</span></h1>
        </div>
        <div class="nav">
            <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Voltar ao Dashboard</a>
        </div>
    </header>

    <main>
        <aside class="panel">
            <h2 class="panel-title">Parâmetros do Backtest</h2>
            
            <form id="runForm">
                <div class="form-group">
                    <label>Ativo (Ticker)</label>
                    <input type="text" id="ticker" value="WEGE3.SA" required>
                </div>

                <div class="form-group">
                    <label>Período (Dias)</label>
                    <input type="number" id="days" value="30" min="5" required>
                </div>

                <div class="form-group">
                    <label>Quantidade de Analistas</label>
                    <input type="number" id="analysts" value="30" min="1" max="100" required>
                </div>

                <div class="form-group">
                    <label>Frequência (Pregões)</label>
                    <input type="number" id="frequency" value="5" min="1" required>
                </div>

                <div class="form-group">
                    <label>LLM Provider</label>
                    <select id="provider">
                        <option value="omnirouter">OmniRouter (Real)</option>
                        <option value="mock">Mock (Simulado)</option>
                    </select>
                </div>

                <button type="submit" class="btn-run" id="runBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">Iniciar Backtest</span>
                </button>
            </form>
        </aside>

        <section class="terminal-container">
            <div class="terminal-header">
                <div class="status-dot" id="statusDot"></div>
                <div class="terminal-title">Terminal: /data/logs/hedgefund.log</div>
            </div>
            <div class="terminal-body" id="terminal"></div>
        </section>
    </main>

    <script>
        const terminal = document.getElementById('terminal');
        const statusDot = document.getElementById('statusDot');
        const form = document.getElementById('runForm');
        const runBtn = document.getElementById('runBtn');
        const btnText = form.querySelector('.btn-text');

        // Formatação de cor para os logs
        function colorizeLog(line) {
            if (line.includes('ERROR') || line.includes('Traceback') || line.includes('Exception')) {
                return `<span class="error">${line}</span>`;
            }
            if (line.includes('INFO')) {
                let formatted = line.replace('INFO', '<span class="info">INFO</span>');
                if (line.includes('OK') || line.includes('success')) {
                    formatted = `<span class="success">${line}</span>`;
                }
                return formatted;
            }
            if (line.includes('WARNING')) {
                return `<span class="warning">${line}</span>`;
            }
            if (line.includes('DEBUG')) {
                return `<span class="dim">${line}</span>`;
            }
            return line;
        }

        let evtSource = null;

        function connectSSE() {
            if (evtSource) evtSource.close();
            
            evtSource = new EventSource('/api/logs');
            statusDot.classList.add('active');

            evtSource.onmessage = function(e) {
                const data = JSON.parse(e.data);
                
                if (data.reset) {
                    terminal.innerHTML = '<span class="dim">[Log reiniciado pelo servidor...]</span>\\n';
                    return;
                }

                if (data.waiting) {
                    return;
                }

                if (data.lines && data.lines.length > 0) {
                    data.lines.forEach(line => {
                        const div = document.createElement('div');
                        div.innerHTML = colorizeLog(line);
                        terminal.appendChild(div);
                        
                        // Auto-scroll
                        terminal.scrollTop = terminal.scrollHeight;
                        
                        // Se detectou fim, destrava o botão (simples heurística)
                        if (line.includes('trades | auditoria:') || line.includes('Telemetria:')) {
                            stopLoading();
                        }
                    });
                }
            };

            evtSource.onerror = function() {
                statusDot.classList.remove('active');
            };
        }

        function stopLoading() {
            runBtn.classList.remove('loading');
            btnText.innerText = 'Iniciar Backtest';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI State
            runBtn.classList.add('loading');
            btnText.innerText = 'Executando Agentes...';
            terminal.innerHTML = '<span class="dim">[Iniciando novo processo de backtest...]</span>\\n';

            const payload = {
                ticker: document.getElementById('ticker').value,
                days: parseInt(document.getElementById('days').value),
                analysts: parseInt(document.getElementById('analysts').value),
                decision_frequency: parseInt(document.getElementById('frequency').value),
                provider: document.getElementById('provider').value
            };

            try {
                const res = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!res.ok) {
                    const err = await res.json();
                    terminal.innerHTML += `<span class="error">Falha ao iniciar: ${err.error}</span>\\n`;
                    stopLoading();
                }
            } catch (err) {
                terminal.innerHTML += `<span class="error">Erro de rede: ${err.message}</span>\\n`;
                stopLoading();
            }
        });

        // Inicia a escuta de logs ao carregar a página
        connectSSE();
    </script>
</body>
</html>
