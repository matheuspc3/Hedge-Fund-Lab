<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>H2 v6 · Hedge-Fund Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --hover: #2a2a27;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --s-L01: #3987e5; --s-L02: #d95926; --s-L03: #199e70;
  --s-buy_and_hold: #c98500; --s-sma_regime_h2_proposed: #d55181; --s-bollinger_state_h2_proposed: #008300;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', monospace;
  --r: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--page); color: var(--text); font: 14px/1.55 var(--sans); min-height: 100vh; -webkit-font-smoothing: antialiased; }
a { color: var(--s-L01); text-decoration: none; } a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }

header { position: sticky; top: 0; z-index: 10; background: rgba(13,13,13,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.bar { max-width: 1320px; margin: 0 auto; padding: 14px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .06em; font-size: 15px; }
.brand small { display: block; font-weight: 500; letter-spacing: 0; color: var(--muted); font-size: 12px; }
nav { display: flex; gap: 4px; margin-left: 12px; flex-wrap: wrap; }
nav button { background: none; border: 0; padding: 8px 14px; border-radius: 8px; color: var(--text-2); font-weight: 500; transition: background .15s, color .15s; }
nav button:hover { background: var(--hover); color: var(--text); }
nav button[aria-selected="true"] { background: var(--surface-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--s-L01); }
.spacer { flex: 1; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.seg button { background: none; border: 0; padding: 6px 12px; border-radius: 7px; color: var(--text-2); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--text); }
.live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--good); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

main { max-width: 1320px; margin: 0 auto; padding: 20px 24px 64px; }
.banner { border-radius: var(--r); padding: 12px 16px; margin-bottom: 16px; font-weight: 600; display: flex; gap: 10px; align-items: center; border: 1px solid; }
.banner.demo { background: repeating-linear-gradient(135deg, rgba(250,178,25,.13) 0 12px, rgba(250,178,25,.06) 12px 24px); border-color: var(--warning); color: var(--warning); font-size: 15px; letter-spacing: .04em; }
.banner.prov { background: rgba(236,131,90,.08); border-color: rgba(236,131,90,.5); color: var(--serious); }
.banner.info { background: var(--surface); border-color: var(--border); color: var(--text-2); font-weight: 500; }

section[hidden] { display: none; }
section { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
h2 { font-size: 18px; font-weight: 600; margin: 8px 0 14px; }
h3 { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
.g-kpi { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.g-3 { grid-template-columns: 2fr 1fr; }
@media (max-width: 900px) { .g-3, .g-2 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; min-width: 0; transition: border-color .2s; }
.card:hover { border-color: rgba(255,255,255,0.16); }
.kpi .label { color: var(--muted); font-size: 12px; font-weight: 500; }
.kpi .value { font-size: 24px; font-weight: 600; margin-top: 4px; }
.kpi .sub { color: var(--text-2); font-size: 12px; margin-top: 2px; }
.up { color: var(--good); } .down { color: var(--serious); }
.chart { position: relative; height: 340px; }
.chart.sm { height: 260px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.chip.good { color: var(--good); border-color: rgba(12,163,12,.4); }
.chip.warn { color: var(--warning); border-color: rgba(250,178,25,.4); }
.chip.bad { color: var(--critical); border-color: rgba(208,59,59,.5); }
.chip.serious { color: var(--serious); border-color: rgba(236,131,90,.45); }
dd .chip { white-space: normal; }
td .mono { white-space: nowrap; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.pick { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; color: var(--text-2); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.pick[aria-pressed="true"] { color: var(--text); border-color: rgba(255,255,255,.35); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.n, th.n { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--hover); }
tr.sel td { background: rgba(57,135,229,.12); }
.scroll { overflow: auto; max-height: 460px; }
.progress { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; min-width: 120px; }
.progress > div { height: 100%; background: var(--s-L01); border-radius: 4px; transition: width .6s ease; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
dt { color: var(--muted); font-size: 12px; } dd { overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--axis); border-radius: var(--r); }
.na { color: var(--warning); font-weight: 600; }
pre { background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; color: var(--text-2); }
.locked { display: flex; gap: 14px; align-items: center; }
.locked .icon { font-size: 22px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend .dash { width: 16px; height: 0; border-top: 2px dashed; }
.legend .solid { width: 16px; height: 0; border-top: 2px solid; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">HEDGE-FUND-LAB<small>H2 v6 · PETR4.SA · Validation</small></div>
    <nav role="tablist" aria-label="Seções">
      <button role="tab" data-tab="overview" aria-selected="true">Visão geral</button>
      <button role="tab" data-tab="experiments" aria-selected="false">Experimentos</button>
      <button role="tab" data-tab="compare" aria-selected="false">Comparações</button>
      <button role="tab" data-tab="audit" aria-selected="false">Auditoria</button>
    </nav>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Fonte de dados">
      <button data-source="provisional" aria-pressed="true">Provisória OA-1</button>
      <button data-source="official" aria-pressed="false">Oficial</button>
      <button data-source="demo" aria-pressed="false">Demonstração</button>
    </div>
    <div class="live"><span class="dot" id="live-dot"></span><span id="live-text">—</span></div>
  </div>
</header>
<main>
  <div id="banner"></div>
  <section id="tab-overview"></section>
  <section id="tab-experiments" hidden></section>
  <section id="tab-compare" hidden></section>
  <section id="tab-audit" hidden></section>
</main>
<footer>Painel somente leitura · cálculos e validação no backend · nenhum controle dispara inferência · Final Test bloqueado</footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/h2.js"></script>
</body>
</html>
