[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-fund-lab"
version = "0.1.0"
description = "Laboratório Quantitativo de Backtesting baseado em Sistemas Multiagentes"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "prefect>=2.0,<3.0",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "hypothesis>=6.0",
    "responses",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
